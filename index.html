<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子爆炸特效</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            cursor: pointer;
        }

        /* Three.js 画布 */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 主标题 */
        .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 2rem;
            text-align: center;
            z-index: 10;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <div class="title">点击屏幕，释放粒子 ✨</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============ 配置参数 ============
        const CONFIG = {
            // 爆炸粒子
            explosionCount: 120,        // 每次爆炸粒子数
            explosionSpeed: 8,          // 爆炸初始速度
            explosionLife: 2.0,         // 粒子生命周期(秒)
            gravity: -9.8,              // 重力加速度
            damping: 0.98,              // 速度阻尼

            // 背景粒子
            bgParticleCount: 200,       // 背景粒子数量
            bgSpeed: 0.3,               // 背景粒子漂浮速度

            // 颜色调色板（暖色调，与原爱心配色呼应）
            palette: [
                0xff6b6b, 0xff8e8e, 0xffa8a8,
                0xffc0cb, 0xff69b4, 0xff1493,
                0xff4500, 0xff6347, 0xff7f50,
                0xffd700, 0xffe4b5, 0xf0e68c,
                0xffffff, 0xffd1dc
            ]
        };

        // ============ Three.js 场景搭建 ============
        const canvas = document.getElementById('particle-canvas');
        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            alpha: true,
            antialias: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 5;

        // ============ 粒子纹理（柔和圆点） ============
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.6, 'rgba(255,255,255,0.3)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const particleTexture = createParticleTexture();

        // ============ 粒子系统 ============
        // 使用对象池管理所有粒子
        const MAX_PARTICLES = 2000;

        // 粒子数据数组
        const positions = new Float32Array(MAX_PARTICLES * 3);
        const colors = new Float32Array(MAX_PARTICLES * 3);
        const sizes = new Float32Array(MAX_PARTICLES);
        const opacities = new Float32Array(MAX_PARTICLES);

        // 粒子状态数组
        const velocities = new Float32Array(MAX_PARTICLES * 3);
        const life = new Float32Array(MAX_PARTICLES);
        const maxLife = new Float32Array(MAX_PARTICLES);
        const active = new Uint8Array(MAX_PARTICLES);

        // 初始化所有粒子为隐藏状态
        for (let i = 0; i < MAX_PARTICLES; i++) {
            opacities[i] = 0;
            sizes[i] = 0;
            active[i] = 0;
        }

        // 创建 BufferGeometry
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        geometry.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));

        // 自定义着色器材质（支持透明度和大小衰减）
        const material = new THREE.ShaderMaterial({
            uniforms: {
                pointTexture: { value: particleTexture }
            },
            vertexShader: `
                attribute float size;
                attribute float opacity;
                varying vec3 vColor;
                varying float vOpacity;
                void main() {
                    vColor = color;
                    vOpacity = opacity;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D pointTexture;
                varying vec3 vColor;
                varying float vOpacity;
                void main() {
                    vec4 texColor = texture2D(pointTexture, gl_PointCoord);
                    gl_FragColor = vec4(vColor, vOpacity) * texColor;
                    if (gl_FragColor.a < 0.01) discard;
                }
            `,
            transparent: true,
            vertexColors: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // ============ 颜色辅助 ============
        function randomColor() {
            const hex = CONFIG.palette[Math.floor(Math.random() * CONFIG.palette.length)];
            const r = ((hex >> 16) & 0xff) / 255;
            const g = ((hex >> 8) & 0xff) / 255;
            const b = (hex & 0xff) / 255;
            return { r, g, b };
        }

        // ============ 粒子发射 ============
        function emitParticle(x, y, velocity, color, lifeTime, size) {
            // 寻找空闲粒子槽
            let idx = -1;
            for (let i = 0; i < MAX_PARTICLES; i++) {
                if (!active[i]) {
                    idx = i;
                    break;
                }
            }
            if (idx === -1) return; // 粒子池已满

            const i3 = idx * 3;

            positions[i3] = x;
            positions[i3 + 1] = y;
            positions[i3 + 2] = 0;

            velocities[i3] = velocity.x;
            velocities[i3 + 1] = velocity.y;
            velocities[i3 + 2] = velocity.z;

            colors[i3] = color.r;
            colors[i3 + 1] = color.g;
            colors[i3 + 2] = color.b;

            sizes[idx] = size;
            opacities[idx] = 1.0;
            life[idx] = lifeTime;
            maxLife[idx] = lifeTime;
            active[idx] = 1;
        }

        // ============ 爆炸效果 ============
        function explode(screenX, screenY) {
            // 屏幕坐标 → Three.js 世界坐标
            const ndcX = (screenX / window.innerWidth) * 2 - 1;
            const ndcY = -(screenY / window.innerHeight) * 2 + 1;
            const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z;
            const worldPos = camera.position.clone().add(dir.multiplyScalar(distance));

            // 发射爆炸粒子
            for (let i = 0; i < CONFIG.explosionCount; i++) {
                // 随机方向（球形分布）
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const speed = CONFIG.explosionSpeed * (0.3 + Math.random() * 0.7);

                const vx = Math.sin(phi) * Math.cos(theta) * speed;
                const vy = Math.sin(phi) * Math.sin(theta) * speed;
                const vz = Math.cos(phi) * speed * 0.3; // z 轴分量较小

                const color = randomColor();
                const lifeTime = CONFIG.explosionLife * (0.5 + Math.random() * 0.5);
                const size = 2 + Math.random() * 4;

                emitParticle(worldPos.x, worldPos.y, { x: vx, y: vy, z: vz }, color, lifeTime, size);
            }
        }

        // ============ 背景漂浮粒子 ============
        function initBackgroundParticles() {
            for (let i = 0; i < CONFIG.bgParticleCount; i++) {
                const x = (Math.random() - 0.5) * 16;
                const y = (Math.random() - 0.5) * 10;
                const vx = (Math.random() - 0.5) * CONFIG.bgSpeed;
                const vy = Math.random() * CONFIG.bgSpeed + 0.1;
                const color = randomColor();
                const lifeTime = 9999; // 背景粒子不会自然死亡
                const size = 1 + Math.random() * 2;

                emitParticle(x, y, { x: vx, y: vy, z: 0 }, color, lifeTime, size);
            }
        }

        // ============ 物理更新 ============
        function updateParticles(deltaTime) {
            const posAttr = geometry.getAttribute('position');
            const colorAttr = geometry.getAttribute('color');
            const sizeAttr = geometry.getAttribute('size');
            const opacityAttr = geometry.getAttribute('opacity');

            for (let i = 0; i < MAX_PARTICLES; i++) {
                if (!active[i]) continue;

                const i3 = i * 3;

                // 背景粒子：持续漂浮 + 边界循环
                if (life[i] >= 9999) {
                    positions[i3] += velocities[i3] * deltaTime;
                    positions[i3 + 1] += velocities[i3 + 1] * deltaTime;

                    // 边界检测：超出边界则从对面重新进入
                    if (positions[i3] > 8) positions[i3] = -8;
                    if (positions[i3] < -8) positions[i3] = 8;
                    if (positions[i3 + 1] > 5) positions[i3 + 1] = -5;
                    if (positions[i3 + 1] < -5) positions[i3 + 1] = 5;

                    opacities[i] = 0.3 + Math.sin(Date.now() * 0.001 + i) * 0.15;
                    continue;
                }

                // 爆炸粒子：物理模拟
                life[i] -= deltaTime;
                if (life[i] <= 0) {
                    active[i] = 0;
                    opacities[i] = 0;
                    sizes[i] = 0;
                    continue;
                }

                // 重力 + 阻尼
                velocities[i3 + 1] += CONFIG.gravity * deltaTime;
                velocities[i3] *= CONFIG.damping;
                velocities[i3 + 1] *= CONFIG.damping;
                velocities[i3 + 2] *= CONFIG.damping;

                // 更新位置
                positions[i3] += velocities[i3] * deltaTime;
                positions[i3 + 1] += velocities[i3 + 1] * deltaTime;
                positions[i3 + 2] += velocities[i3 + 2] * deltaTime;

                // 透明度随生命衰减
                const lifeRatio = life[i] / maxLife[i];
                opacities[i] = lifeRatio;

                // 尺寸随生命衰减
                sizes[i] = sizes[i] * 0.999 + lifeRatio * 0.5;
            }

            // 标记需要更新
            posAttr.needsUpdate = true;
            colorAttr.needsUpdate = true;
            sizeAttr.needsUpdate = true;
            opacityAttr.needsUpdate = true;
        }

        // ============ 动画循环 ============
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const deltaTime = Math.min((now - lastTime) / 1000, 0.05); // 限制最大 delta
            lastTime = now;

            updateParticles(deltaTime);
            renderer.render(scene, camera);
        }

        // ============ 事件监听 ============
        // 点击爆炸
        document.addEventListener('click', (e) => {
            explode(e.clientX, e.clientY);
        });

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============ 启动 ============
        initBackgroundParticles();
        animate();
    </script>
</body>
</html>
