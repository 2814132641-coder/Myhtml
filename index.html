<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能量粒子爆发</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at center, #060612 0%, #000 100%);
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            cursor: crosshair;
        }
        canvas { display: block; }
        .title {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(100, 200, 255, 0.45);
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 30px rgba(0, 150, 255, 0.6);
            animation: pulse 3s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="title">ENERGY CORE</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    (function() {
        'use strict';

        // ========== 渲染器 ==========
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000011, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 5;

        // ========== 发光粒子纹理 ==========
        function makeGlowTexture() {
            const s = 64, c = document.createElement('canvas');
            c.width = c.height = s;
            const g = c.getContext('2d').createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.15, 'rgba(255,255,255,0.9)');
            g.addColorStop(0.4, 'rgba(180,210,255,0.4)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            c.getContext('2d').fillStyle = g;
            c.getContext('2d').fillRect(0, 0, s, s);
            return new THREE.CanvasTexture(c);
        }
        const glowTex = makeGlowTexture();

        // ========== 颜色 ==========
        const COLORS = [
            new THREE.Color(0x00ddff),
            new THREE.Color(0x0066ff),
            new THREE.Color(0x6600ff),
            new THREE.Color(0x00ffcc),
            new THREE.Color(0xffffff),
            new THREE.Color(0xaa44ff),
        ];
        function pickColor() { return COLORS[(Math.random() * COLORS.length) | 0]; }

        // ========== 核心：单一 BufferGeometry 管理所有粒子 ==========
        const MAX = 1500;

        const positions = new Float32Array(MAX * 3);
        const colors = new Float32Array(MAX * 3);
        const sizes = new Float32Array(MAX);

        // 粒子状态（用普通对象数组，避免 class 开销）
        const N = MAX;
        const vx = new Float32Array(N);
        const vy = new Float32Array(N);
        const vz = new Float32Array(N);
        const life = new Float32Array(N);
        const maxLife = new Float32Array(N);
        const active = new Uint8Array(N);
        const pType = new Uint8Array(N); // 0=爆炸 1=拖尾 2=火花 3=背景

        // 背景粒子闪烁频率（预计算）
        const bgFreq = new Float32Array(N);
        const bgPhase = new Float32Array(N);

        // 初始化隐藏
        for (let i = 0; i < N; i++) { sizes[i] = 0; }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // 使用 PointsMaterial + 自定义着色器（比 ShaderMaterial 快）
        const mat = new THREE.PointsMaterial({
            size: 6,
            map: glowTex,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            sizeAttenuation: true,
        });

        // 通过 onBeforeCompile 注入自定义点大小
        mat.onBeforeCompile = function(shader) {
            shader.vertexShader = 'attribute float size;\nvarying vec3 vColor;\n' +
                shader.vertexShader.replace(
                    'gl_PointSize = size;',
                    'gl_PointSize = size * 3.0; vColor = color;'
                );
            shader.fragmentShader = 'varying vec3 vColor;\n' +
                shader.fragmentShader.replace(
                    'vec4 diffuseColor = vec4( diffuse, opacity );',
                    'vec4 diffuseColor = vec4( vColor, opacity );'
                );
        };

        const points = new THREE.Points(geo, mat);
        scene.add(points);

        // ========== 冲击波（环形几何体，对象池） ==========
        const shockPool = [];
        const shockActive = [];
        const SHOCK_MAX = 8;

        for (let i = 0; i < SHOCK_MAX; i++) {
            const ringGeo = new THREE.RingGeometry(0.8, 1.0, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x00aaff,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide,
                depthWrite: false,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.visible = false;
            scene.add(ring);
            shockPool.push(ring);
            shockActive.push(false);
        }

        function spawnShockwave(x, y, color) {
            for (let i = 0; i < SHOCK_MAX; i++) {
                if (!shockActive[i]) {
                    const ring = shockPool[i];
                    ring.position.set(x, y, 0.05);
                    ring.scale.set(0.01, 0.01, 1);
                    ring.material.color.copy(color);
                    ring.material.opacity = 0.9;
                    ring.visible = true;
                    ring.userData = { life: 0.8, maxLife: 0.8 };
                    shockActive[i] = true;
                    return;
                }
            }
        }

        // ========== 闪光（球体，对象池） ==========
        const flashPool = [];
        const flashActive = [];
        const FLASH_MAX = 6;

        for (let i = 0; i < FLASH_MAX; i++) {
            const g = new THREE.CircleGeometry(0.5, 32);
            const m = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });
            const mesh = new THREE.Mesh(g, m);
            mesh.visible = false;
            scene.add(mesh);
            flashPool.push(mesh);
            flashActive.push(false);
        }

        function spawnFlash(x, y) {
            for (let i = 0; i < FLASH_MAX; i++) {
                if (!flashActive[i]) {
                    const mesh = flashPool[i];
                    mesh.position.set(x, y, 0.1);
                    mesh.scale.set(0.01, 0.01, 1);
                    mesh.material.opacity = 1;
                    mesh.visible = true;
                    mesh.userData = { life: 0.35, maxLife: 0.35 };
                    flashActive[i] = true;
                    return;
                }
            }
        }

        // ========== 闪电线（对象池） ==========
        const lightningPool = [];
        const lightningActive = [];
        const LIGHT_MAX = 12;

        for (let i = 0; i < LIGHT_MAX; i++) {
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(20 * 3), 3));
            const m = new THREE.LineBasicMaterial({
                color: 0x00ccff,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });
            const line = new THREE.Line(g, m);
            line.visible = false;
            scene.add(line);
            lightningPool.push(line);
            lightningActive.push(false);
        }

        function spawnLightning(x, y, color) {
            for (let i = 0; i < LIGHT_MAX; i++) {
                if (!lightningActive[i]) {
                    const line = lightningPool[i];
                    const posArr = line.geometry.attributes.position.array;
                    const segments = 8 + ((Math.random() * 5) | 0);
                    const angle = Math.random() * Math.PI * 2;
                    const len = 1.5 + Math.random() * 2.5;
                    let cx = x, cy = y;

                    for (let j = 0; j <= segments; j++) {
                        const idx = j * 3;
                        posArr[idx] = cx;
                        posArr[idx + 1] = cy;
                        posArr[idx + 2] = 0;
                        const t = j / segments;
                        const tx = x + Math.cos(angle) * len * t;
                        const ty = y + Math.sin(angle) * len * t;
                        cx = tx + (Math.random() - 0.5) * 0.6 * (1 - t);
                        cy = ty + (Math.random() - 0.5) * 0.6 * (1 - t);
                    }
                    // 填充剩余
                    for (let j = segments + 1; j < 20; j++) {
                        posArr[j * 3] = cx;
                        posArr[j * 3 + 1] = cy;
                        posArr[j * 3 + 2] = 0;
                    }

                    line.geometry.attributes.position.needsUpdate = true;
                    line.geometry.setDrawRange(0, segments + 1);
                    line.material.color.copy(color);
                    line.material.opacity = 1;
                    line.visible = true;
                    line.userData = { life: 0.2 + Math.random() * 0.15, maxLife: 0.25 };
                    lightningActive[i] = true;
                    return;
                }
            }
        }

        // ========== 粒子发射 ==========
        let cursor = 0;
        function nextSlot() {
            // 简单轮询找空闲槽
            for (let i = 0; i < N; i++) {
                const idx = (cursor + i) % N;
                if (!active[idx]) {
                    cursor = (idx + 1) % N;
                    return idx;
                }
            }
            cursor = (cursor + 1) % N;
            return cursor; // 全覆盖，覆盖最老的
        }

        function emit(x, y, z, velX, velY, velZ, r, g, b, size, pLife, type) {
            const i = nextSlot();
            const i3 = i * 3;
            positions[i3] = x; positions[i3+1] = y; positions[i3+2] = z;
            vx[i] = velX; vy[i] = velY; vz[i] = velZ;
            colors[i3] = r; colors[i3+1] = g; colors[i3+2] = b;
            sizes[i] = size;
            life[i] = pLife;
            maxLife[i] = pLife;
            active[i] = 1;
            pType[i] = type;
        }

        // ========== 爆炸 ==========
        function explode(sx, sy) {
            const ndcX = (sx / window.innerWidth) * 2 - 1;
            const ndcY = -(sy / window.innerHeight) * 2 + 1;
            const v = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
            const d = v.sub(camera.position).normalize();
            const dist = -camera.position.z / d.z;
            const p = camera.position.clone().add(d.multiplyScalar(dist));

            const base = pickColor();

            // 闪光
            spawnFlash(p.x, p.y);
            // 冲击波
            spawnShockwave(p.x, p.y, base);
            setTimeout(() => spawnShockwave(p.x, p.y, base), 80);
            // 闪电
            const lc = 3 + ((Math.random() * 3) | 0);
            for (let i = 0; i < lc; i++) spawnLightning(p.x, p.y, base);

            // 主粒子
            for (let i = 0; i < 250; i++) {
                const th = Math.random() * 6.2832;
                const ph = Math.acos(2 * Math.random() - 1);
                const sp = 2 + Math.random() * 7;
                const c = Math.random() < 0.25 ? new THREE.Color(0xffffff) : base.clone().offsetHSL((Math.random()-0.5)*0.08, (Math.random()-0.5)*0.15, (Math.random()-0.5)*0.1);
                emit(p.x, p.y, 0,
                    Math.sin(ph)*Math.cos(th)*sp,
                    Math.sin(ph)*Math.sin(th)*sp,
                    Math.cos(ph)*sp*0.15,
                    c.r, c.g, c.b,
                    3 + Math.random()*4,
                    0.8 + Math.random()*1.2, 0);
            }
            // 拖尾
            for (let i = 0; i < 120; i++) {
                const th = Math.random() * 6.2832;
                const sp = 0.8 + Math.random() * 2.5;
                const c = base.clone().offsetHSL(0, -0.15, 0.15);
                emit(p.x, p.y, 0,
                    Math.cos(th)*sp, Math.sin(th)*sp, (Math.random()-0.5)*0.3,
                    c.r, c.g, c.b,
                    1.5 + Math.random()*2,
                    1.2 + Math.random()*1.5, 1);
            }
            // 火花
            for (let i = 0; i < 80; i++) {
                const th = Math.random() * 6.2832;
                const sp = 5 + Math.random() * 10;
                const c = Math.random() < 0.4 ? new THREE.Color(0xffffff) : base;
                emit(p.x, p.y, 0,
                    Math.cos(th)*sp, Math.sin(th)*sp, (Math.random()-0.5)*2,
                    c.r, c.g, c.b,
                    1 + Math.random()*1.5,
                    0.3 + Math.random()*0.6, 2);
            }
        }

        // ========== 背景粒子 ==========
        function initBG() {
            for (let i = 0; i < 200; i++) {
                const x = (Math.random() - 0.5) * 18;
                const y = (Math.random() - 0.5) * 11;
                const c = pickColor();
                emit(x, y, (Math.random()-0.5)*2,
                    (Math.random()-0.5)*0.1, 0.03 + Math.random()*0.12, (Math.random()-0.5)*0.05,
                    c.r, c.g, c.b,
                    1 + Math.random()*2,
                    99999, 3);
                bgFreq[i] = 0.3 + Math.random() * 1.5;
                bgPhase[i] = Math.random() * 6.28;
            }
        }

        // ========== 更新 ==========
        function update(dt) {
            const posAttr = geo.getAttribute('position');
            const sizeAttr = geo.getAttribute('size');
            const t = performance.now() * 0.001;

            for (let i = 0; i < N; i++) {
                if (!active[i]) continue;
                const i3 = i * 3;

                if (pType[i] === 3) {
                    // 背景：漂浮 + 闪烁
                    positions[i3]   += vx[i] * dt;
                    positions[i3+1] += vy[i] * dt;
                    positions[i3+2] += vz[i] * dt;
                    if (positions[i3] > 9) positions[i3] = -9;
                    if (positions[i3] < -9) positions[i3] = 9;
                    if (positions[i3+1] > 5.5) positions[i3+1] = -5.5;
                    if (positions[i3+1] < -5.5) positions[i3+1] = 5.5;
                    if (positions[i3+2] > 3) positions[i3+2] = -3;
                    if (positions[i3+2] < -3) positions[i3+2] = 3;
                    sizes[i] = (1 + Math.sin(t * bgFreq[i] + bgPhase[i]) * 0.4) * 1.5;
                    continue;
                }

                life[i] -= dt;
                if (life[i] <= 0) {
                    active[i] = 0;
                    sizes[i] = 0;
                    continue;
                }

                const ratio = life[i] / maxLife[i];

                // 阻尼 + 微扰
                vx[i] *= 0.96;
                vy[i] *= 0.96;
                vy[i] += (Math.random() - 0.5) * 3 * dt;
                vz[i] *= 0.96;

                positions[i3]   += vx[i] * dt;
                positions[i3+1] += vy[i] * dt;
                positions[i3+2] += vz[i] * dt;

                sizes[i] = sizes[i] * 0.98 + ratio * 2;
            }

            posAttr.needsUpdate = true;
            sizeAttr.needsUpdate = true;

            // 冲击波更新
            for (let i = 0; i < SHOCK_MAX; i++) {
                if (!shockActive[i]) continue;
                const ring = shockPool[i];
                ring.userData.life -= dt;
                if (ring.userData.life <= 0) {
                    ring.visible = false;
                    shockActive[i] = false;
                    continue;
                }
                const t2 = 1 - ring.userData.life / ring.userData.maxLife;
                const s = 0.01 + t2 * 5;
                ring.scale.set(s, s, 1);
                ring.material.opacity = (1 - t2) * 0.85;
            }

            // 闪光更新
            for (let i = 0; i < FLASH_MAX; i++) {
                if (!flashActive[i]) continue;
                const mesh = flashPool[i];
                mesh.userData.life -= dt;
                if (mesh.userData.life <= 0) {
                    mesh.visible = false;
                    flashActive[i] = false;
                    continue;
                }
                const t2 = 1 - mesh.userData.life / mesh.userData.maxLife;
                const s = 0.01 + t2 * 2.5;
                mesh.scale.set(s, s, 1);
                mesh.material.opacity = (1 - t2) * (1 - t2);
            }

            // 闪电更新
            for (let i = 0; i < LIGHT_MAX; i++) {
                if (!lightningActive[i]) continue;
                const line = lightningPool[i];
                line.userData.life -= dt;
                if (line.userData.life <= 0) {
                    line.visible = false;
                    lightningActive[i] = false;
                    continue;
                }
                line.material.opacity = line.userData.life / line.userData.maxLife;
            }
        }

        // ========== 动画循环 ==========
        let last = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min((now - last) / 1000, 0.05);
            last = now;
            update(dt);
            renderer.render(scene, camera);
        }

        // ========== 事件 ==========
        window.addEventListener('click', (e) => explode(e.clientX, e.clientY));
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ========== 启动 ==========
        initBG();
        animate();
    })();
    </script>
</body>
</html>
